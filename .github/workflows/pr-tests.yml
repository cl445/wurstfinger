name: PR Tests

on:
  pull_request:
    branches: [ "develop" ]

jobs:
  lint:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Tools
        run: brew install swiftlint swiftformat

      - name: Run SwiftFormat
        run: swiftformat --lint .

      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  naming:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # A miscount would be written straight into the budget, so the counting
      # itself is tested: comments and strings must not count, interpolations must.
      - name: Test the Naming Checker
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      # Vocabulary in glossary.toml, backlog in .naming-budget.json. The budget
      # may shrink but never grow, so a rejected spelling cannot be added to a
      # file that does not already carry one.
      - name: Check Naming Against the Glossary
        run: python3 scripts/check_naming.py check

      # Sections 7-9 of docs/GLOSSARY.md are generated from the same two files.
      - name: Check the Generated Glossary Sections
        run: python3 scripts/check_naming.py render --check

  markdown:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Rules and ignores come from .markdownlint-cli2.jsonc in the repo root.
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

  dead-code:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Periphery
        run: brew install peripheryapp/periphery/periphery

      - name: Scan for Dead Code
        run: periphery scan --disable-update-check

  test:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Boot Simulator
        id: sim
        timeout-minutes: 5
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available | grep "iPhone 16" | grep -v "Plus\|Pro" | head -1 | grep -oE '\([A-F0-9-]+\)' | tr -d '()')
          if [ -z "$SIMULATOR_ID" ]; then
            echo "iPhone 16 simulator not found, using iPhone 15"
            SIMULATOR_ID=$(xcrun simctl list devices available | grep "iPhone 15" | grep -v "Plus\|Pro" | head -1 | grep -oE '\([A-F0-9-]+\)' | tr -d '()')
          fi
          if [ -z "$SIMULATOR_ID" ]; then
            echo "::error::No compatible iPhone simulator found (iPhone 16 or iPhone 15)"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator: $SIMULATOR_ID"
          echo "simulator_id=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID"

      - name: Build and Run Tests
        timeout-minutes: 30
        run: |
          set -o pipefail && xcodebuild test \
            -scheme Wurstfinger \
            -project Wurstfinger.xcodeproj \
            -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.simulator_id }}' \
            -only-testing:WurstfingerTests \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color --report html --output TestResults.html

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            TestResults.xcresult
            TestResults.html
          retention-days: 30
