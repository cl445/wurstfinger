# SwiftLint Configuration for Wurstfinger

included:
  - wurstfinger
  - wurstfingerKeyboard
  - wurstfingerTests
  - wurstfingerUITests

excluded:
  - DerivedData
  - build
  - .build
  - Pods

# Rules tuned for a gesture-based keyboard with lots of geometry code
identifier_name:
  min_length:
    warning: 1
  excluded:
    - id

line_length:
  warning: 150
  error: 200
  ignores_comments: true
  ignores_urls: true

type_name:
  excluded:
    - wurstfingerApp
    - wurstfingerUITests
    - wurstfingerUITestsLaunchTests
    - wurstfingerTests

file_length:
  warning: 1100
  error: 1500

type_body_length:
  warning: 500
  error: 800

function_body_length:
  warning: 250
  error: 400

large_tuple:
  warning: 4

function_parameter_count:
  warning: 7

cyclomatic_complexity:
  warning: 15
  error: 25

disabled_rules:
  - trailing_comma  # Trailing commas improve diffs
  - implicit_optional_initialization  # Removing = nil breaks memberwise initializers

custom_rules:
  ui_test_app_factory:
    included: ".*wurstfingerUITests/.*"
    excluded: ".*wurstfingerUITests/UITestApp\\.swift"
    name: "UI test app factory"
    regex: "XCUIApplication\\(\\)|\\.launchArguments\\s*="
    message: "Build the app under test with UITestApp.make() — a bare XCUIApplication() or launchArguments assignment drops the isolated defaults suite and writes into the real app group"
    severity: error

  # Glossary rules, from glossary.toml. Regenerate with
  #     python3 scripts/check_naming.py sync-lint
  # Each rule excludes the files that still carry a backlog for it, because CI
  # lints with --strict and a warning in legacy code would block every commit.
  # Those files stay covered by .naming-budget.json, which forbids growth;
  # every other file is gated here, in the editor, while typing.
  # --- generated by scripts/check_naming.py — do not edit ---
  glossary_config_suffix:
    name: "Glossary: config suffix"
    regex: "\\b[A-Za-z]*Config\\b"
    match_kinds: [identifier]
    message: "Suffixes are spelled out; Apple's own APIs are consistent about this. Write `…Configuration` for injected runtime parameters, `…Definition` for declarative data instead (docs/GLOSSARY.md)."
    severity: error
    excluded:
      - "wurstfinger/LanguageSelectionView\\.swift"
      - "wurstfingerKeyboard/Definition/Language/LanguageConfig\\.swift"
      - "wurstfingerKeyboard/KeyboardViewController\\.swift"
      - "wurstfingerKeyboard/Runtime/Pipeline/KeyboardViewModel\\+Pipeline\\.swift"
      - "wurstfingerKeyboard/Settings/LanguageSettings\\.swift"
      - "wurstfingerTests/KeyboardStateHygieneTests\\.swift"
      - "wurstfingerTests/LanguageDefinitionTests\\.swift"
      - "wurstfingerTests/LanguageSettingsTests\\.swift"
      - "wurstfingerTests/LayoutValidationTests\\.swift"
      - "wurstfingerTests/TestFixtures\\.swift"
      - "wurstfingerTests/ViewModelPipelineTests\\.swift"
  glossary_create_prefix:
    name: "Glossary: create prefix"
    regex: "\\bcreate[A-Z][A-Za-z]*\\b"
    match_kinds: [identifier]
    message: "`make…` is the factory verb; a second one alongside it splits the vocabulary. Write `make…` instead (docs/GLOSSARY.md)."
    severity: error
  glossary_gesture_preprocessor_config:
    name: "Glossary: GesturePreprocessorConfig"
    regex: "\\bGesturePreprocessorConfig\\b"
    match_kinds: [identifier]
    message: "`GesturePreprocessorConfig` is rejected — the glossary term is `GesturePreprocessorConfiguration` (docs/GLOSSARY.md)."
    severity: error
  glossary_hide_extra_symbols:
    name: "Glossary: hideExtraSymbols"
    regex: "\\bhideExtraSymbols\\b"
    match_kinds: [identifier]
    message: "`hideExtraSymbols` is rejected — the glossary term is `areExtraSymbolLabelsHidden` (docs/GLOSSARY.md)."
    severity: error
  glossary_hide_letters:
    name: "Glossary: hideLetters"
    regex: "\\bhideLetters\\b"
    match_kinds: [identifier]
    message: "`hideLetters` is rejected — the glossary term is `areLetterLabelsHidden` (docs/GLOSSARY.md)."
    severity: error
  glossary_hide_standard_symbols:
    name: "Glossary: hideStandardSymbols"
    regex: "\\bhideStandardSymbols\\b"
    match_kinds: [identifier]
    message: "`hideStandardSymbols` is rejected — the glossary term is `areStandardSymbolLabelsHidden` (docs/GLOSSARY.md)."
    severity: error
  glossary_key_config:
    name: "Glossary: KeyConfig"
    regex: "\\bKeyConfig\\b"
    match_kinds: [identifier]
    message: "`KeyConfig` is rejected — the glossary term is `KeyDefinition` (docs/GLOSSARY.md)."
    severity: error
  glossary_keyboard_info:
    name: "Glossary: KeyboardInfo"
    regex: "\\bKeyboardInfo\\b"
    match_kinds: [identifier]
    message: "`KeyboardInfo` is rejected — the glossary term is `LanguageDescriptor` (docs/GLOSSARY.md)."
    severity: error
    excluded:
      - "wurstfingerKeyboard/Definition/Language/KeyboardInfo\\.swift"
      - "wurstfingerKeyboard/Definition/Language/KeyboardRegistry\\.swift"
      - "wurstfingerTests/KeyboardRegistryTests\\.swift"
      - "wurstfingerTests/LanguageDescriptorTests\\.swift"
  glossary_kind_suffix:
    name: "Glossary: kind suffix"
    regex: "\\b[A-Za-z]*Kind\\b"
    match_kinds: [identifier]
    message: "A closed set of behavioural variants carries `…Type`. Write `…Type` instead (docs/GLOSSARY.md)."
    severity: error
  glossary_language_config:
    name: "Glossary: LanguageConfig"
    regex: "\\bLanguageConfig\\b"
    match_kinds: [identifier]
    message: "`LanguageConfig` is rejected — the glossary term is `LanguageDescriptor` (docs/GLOSSARY.md)."
    severity: error
    excluded:
      - "wurstfinger/LanguageSelectionView\\.swift"
      - "wurstfingerKeyboard/Definition/Language/LanguageConfig\\.swift"
      - "wurstfingerKeyboard/KeyboardViewController\\.swift"
      - "wurstfingerKeyboard/Runtime/Pipeline/KeyboardViewModel\\+Pipeline\\.swift"
      - "wurstfingerKeyboard/Settings/LanguageSettings\\.swift"
      - "wurstfingerTests/KeyboardStateHygieneTests\\.swift"
      - "wurstfingerTests/LanguageDefinitionTests\\.swift"
      - "wurstfingerTests/LanguageSettingsTests\\.swift"
      - "wurstfingerTests/LayoutValidationTests\\.swift"
      - "wurstfingerTests/TestFixtures\\.swift"
      - "wurstfingerTests/ViewModelPipelineTests\\.swift"
  glossary_layer_word:
    name: "Glossary: layer word"
    regex: "(?!(?:CAGradientLayer|CALayer|CAShapeLayer)\\b)\\b[A-Za-z]*(?<![Pp])[Ll]ayer[A-Za-z]*\\b"
    match_kinds: [identifier]
    message: "\"Layer\" is not canonical for a keyboard state. Write `mode` instead (docs/GLOSSARY.md)."
    severity: error
  glossary_long_press_numbers_enabled:
    name: "Glossary: longPressNumbersEnabled"
    regex: "\\blongPressNumbersEnabled\\b"
    match_kinds: [identifier]
    message: "`longPressNumbersEnabled` is rejected — the glossary term is `isLongPressDigitEnabled` (docs/GLOSSARY.md)."
    severity: error
  glossary_screenshot_config:
    name: "Glossary: ScreenshotConfig"
    regex: "\\bScreenshotConfig\\b"
    match_kinds: [identifier]
    message: "`ScreenshotConfig` is rejected — the glossary term is `ScreenshotConfiguration` (docs/GLOSSARY.md)."
    severity: error
  glossary_screenshot_mode:
    name: "Glossary: ScreenshotMode"
    regex: "\\bScreenshotMode\\b"
    match_kinds: [identifier]
    message: "`ScreenshotMode` is rejected — the glossary term is `ScreenshotType` (docs/GLOSSARY.md)."
    severity: error
  glossary_show_language_label:
    name: "Glossary: showLanguageLabel"
    regex: "\\bshowLanguageLabel\\b"
    match_kinds: [identifier]
    message: "`showLanguageLabel` is rejected — the glossary term is `isLanguageLabelShown` (docs/GLOSSARY.md)."
    severity: error
  glossary_slot_id:
    name: "Glossary: slotId"
    regex: "\\bslotId\\b"
    match_kinds: [identifier]
    message: "`slotId` is rejected — the glossary term is `keyId` (docs/GLOSSARY.md)."
    severity: error
  glossary_vague_type_suffix:
    name: "Glossary: vague type suffix"
    regex: "(?!(?:FileManager|fileManager)\\b)\\b[A-Za-z]*(Manager|Helper|Helpers|Utils|Util)\\b"
    match_kinds: [identifier]
    message: "`…Manager`, `…Helper` and `…Utils` describe no responsibility. Write a name that says what the type does instead (docs/GLOSSARY.md)."
    severity: error
  # --- end generated ---
